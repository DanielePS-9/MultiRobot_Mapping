# Custom SLAM Toolbox configuration file for Robot2
# Modified from https://github.com/SteveMacenski/slam_toolbox/blob/ros2/config/mapper_params_online_sync.yaml

robot2/slam_toolbox:
  ros__parameters:
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None
 
    use_sim_time: true
    autostart: true
    # Set the odom_frame, base_frame, and map_frame to unique values for each robot to avoid conflicts in a multi-robot setup
    odom_frame: robot2/odom
    base_frame: robot2/base_footprint
    map_frame: robot2/map
    map_name: /robot2/map
    use_map_saver: true
    scan_topic: scan
    mode: mapping
    debug_logging: false
    throttle_scans: 1
    # Set the transform publish period to 0.05 seconds (20 Hz) for smoother visualization in RViz (default is 0.02)
    transform_publish_period: 0.05
    # Set the map update interval to 2.0 seconds to improve the frequency of map updates in RViz (default is 5.0)
    map_update_interval: 2.0
    # Set the maximum laser range to 3.5 meters to limit the range of the laser scan data (default is 20.0)
    max_laser_range: 3.5
    # Set the minimum time interval between scans to 0.1 seconds for better responsiveness of scan processing (default is 0.5)
    minimum_time_interval: 0.1
    transform_timeout: 0.2
    tf_buffer_duration: 30.0

    # Set the minimum travel distance and heading to avoid updating the map when the robot is stationary or rotating imperceptibly (defaults are 0.5 and 0.5)
    minimum_travel_distance: 0.2     
    minimum_travel_heading: 0.2      
    
    # Set the correlation search space parameters to limit the area of laser scan matching, improving odometry confidence (defaults are 0.5, 0.01, and 0.1)
    correlation_search_space_dimension: 0.3
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.05
    
    do_loop_closure: true
    # Set the loop search maximum distance to 3.0 meters to limit the search area for loop closure detection
    loop_search_maximum_distance: 3.0
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0  
    # Set the loop match minimum response thresholds to higher values to ensure that loop closures are only accepted 
    #when the robot is very confident that it is in the same room, ignoring false corridors (defaults are 0.35 and 0.45)
    loop_match_minimum_response_coarse: 0.50  
    loop_match_minimum_response_fine: 0.75
    
    resolution: 0.05