# Custom navigation parameters for multi-robot navigation using Nav2.
# Modified from https://github.com/ros-navigation/navigation2/blob/main/nav2_bringup/params/nav2_params.yaml

bt_navigator:
  ros__parameters:
    # Set the global and robot base frames with the robot namespace
    global_frame: ${ROBOT_NAME}/map
    robot_base_frame: ${ROBOT_NAME}/base_footprint
    # Set the odom topic relative to remap it to the correct robot namespace
    odom_topic: odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    # Set the action server result timeout to a large value to allow for long-running navigation tasks
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # Set the error code names for the navigation stack to allow for better debugging and error handling
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      # Set the yaw goal tolerance to 2*pi to allow any orientation at the goal
      yaw_goal_tolerance: 6.28

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      # Reduce the number of time steps to 30 to reduce the computational load and improve performance (default is 56)
      time_steps: 30
      model_dt: 0.05
      # Reduce the number of control samples to 1000 to reduce the computational load and improve performance (default is 2000)
      batch_size: 1000
      ax_max: 3.0
      ax_min: -3.0
      ay_max: 3.0
      ay_min: -3.0
      az_max: 3.5
      vx_std: 0.2
      vy_std: 0.2
      wz_std: 0.4
      # Reduce the maximum and minimum velocities to make the robot move slower and more cautiously (default is 0.5 for vx_max and -0.35 for vx_min)
      vx_max: 0.25 
      vx_min: -0.15 
      vtheta_max: 0.50
      vtheta_min: -0.50
      vy_max: 0.5
      wz_max: 1.9
      iteration_count: 1
      prune_distance: 1.7
      transform_tolerance: 0.1
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive"
      visualize: false
      regenerate_noises: true
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      AckermannConstraints:
        min_turning_r: 0.2
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic",
                "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81 
        near_collision_cost: 253
        critical_cost: 300.0
        consider_footprint: false
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0


local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: ${ROBOT_NAME}/odom
      robot_base_frame: ${ROBOT_NAME}/base_footprint
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.22
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        # Set the inflation radius to 0.55 to reduce the size of the inflated area around obstacles (default is 0.7)
        inflation_radius: 0.55
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: scan
          sensor_frame: ${ROBOT_NAME}/base_scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: ${ROBOT_NAME}/map
      robot_base_frame: ${ROBOT_NAME}/base_footprint
      robot_radius: 0.22
      resolution: 0.05
      # Set track_unknown_space to true to allow the robot to navigate in unknown areas and explore new regions of the environment
      track_unknown_space: true 
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: scan
          sensor_frame: ${ROBOT_NAME}/base_scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Set the cost scaling factor to 8.0 to increase the cost of obstacles and make the robot more cautious when navigating around them (default is 3.0)
        cost_scaling_factor: 8.0 
        # Set the inflation radius to 0.65 to reduce the size of the inflated area around obstacles (default is 0.7)
        inflation_radius: 0.65
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 1.0
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    # Set the behavior plugins to include "spin", "wait", and "backup" to allow the robot to perform these behaviors during navigation (default is ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"])
    behavior_plugins: ["spin", "wait", "backup"]
    spin:
      plugin: "nav2_behaviors::Spin"
      # Set the maximum rotational velocity to 0.4 to reduce the speed of the robot's spin behavior and make it more cautious
      max_rotational_vel: 0.4
      # Set the minimum rotational velocity to 0.2 to ensure that the robot can still spin even when it is moving slowly
      min_rotational_vel: 0.2
      time_allowed: 5.0
    backup:
      plugin: "nav2_behaviors::BackUp"
      # Set the backup speed to 0.15 to reduce the speed of the robot's backup behavior and make it more cautious
      speed: 0.15
      time_allowed: 1.2 
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: ${ROBOT_NAME}/odom
    global_frame: ${ROBOT_NAME}/map
    robot_base_frame: ${ROBOT_NAME}/base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    # Set the maximum and minimum rotational velocities to 0.5 and 0.2, respectively, to reduce the speed of the robot's rotation during navigation and make it more cautious (default is 1.0 and 0.4)
    max_rotational_vel: 0.5
    min_rotational_vel: 0.2
    # Set the rotational acceleration limit to 1.0 to reduce the speed of the robot's rotation during navigation and make it more cautious (default is 3.2)
    rotational_acc_lim: 1.0

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    # Set the maximum velocities to [0.26, 0.0, 0.5] to reduce the speed of the robot's movement during navigation and make it more cautious (default is [0.5, 0.0, 2.0])
    max_velocity: [0.26, 0.0, 0.5]
    # Set the minimum velocities to [-0.15, 0.0, -0.5] to reduce the speed of the robot's movement during navigation and make it more cautious (default is [-0.5, 0.0, -2.0])
    min_velocity: [-0.15, 0.0, -0.5]
    # Set the maximum accelerations to [0.5, 0.0, 1.0] to reduce the speed of the robot's acceleration during navigation and make it more cautious (default is [2.5, 0.0, 3.2])
    max_accel: [0.5, 0.0, 1.0]
    # Set the maximum decelerations to [-0.5, 0.0, -1.0] to reduce the speed of the robot's deceleration during navigation and make it more cautious (default is [-2.5, 0.0, -3.2])
    max_decel: [-0.5, 0.0, -1.0]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

smoother_server:
  ros__parameters:
    smoother_plugins: ["SimpleSmoother"]
    SimpleSmoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

# Set the lifecycle manager to autostart and manage the navigation stack nodes
lifecycle_manager_navigation:
  ros__parameters:
    autostart: true
    node_names:
      - controller_server
      - smoother_server
      - planner_server
      - behavior_server
      - velocity_smoother
      - bt_navigator
      - waypoint_follower
    bond_timeout: 4.0